name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        run: |
          touch .env
          touch .env.example
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper and Permissions
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamicApp-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Prepare Release APK Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DailyWird-iOS-Edition.apk

      - name: Publish New GitHub Release v1.1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "DailyWird v1.1.0 (Apple iOS Edition)"
          body: |
            # 🌿 الورد اليومي - الإصدار الجديد v1.1.0 (Apple iOS Edition)

            ### ✨ جديد هذا الإصدار:
            - **إلغاء قسم الفتاوى بالكامل:** حذف كافة ملفات الفتاوى والشاتبوت والبيانات الفقهية وفق رغبة المستخدم.
            - **ترقية تجربة المستخدم (UI/UX Pro Max):**
              - إضافة مسبحة إلكترونية ذكية تفاعلية مع تفاعل لمسي واهتزاز ناعم.
              - إضافة محاكي وعداد أشواط الطواف والسعي مع الأدعية المأثورة.
              - إضافة مشغل صوتي لآيات التحصين والرقية الشرعية بدون إنترنت.
              - نظام إشعارات عائم (Toast Notifications) تفاعلي عند نسخ الروابط وحفظ الأوراد.
              - تحسين معايير الوصول الشامل والتباين اللوني ونظام الألوان الزجاجي الفاخر.
            - **100% بدون إنترنت (Offline):** مجاني بالكامل لوجه الله تعالى دون أي إعلانات أو تتبع.
          files: app/build/outputs/apk/debug/DailyWird-iOS-Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Existing Release v1.0.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          files: app/build/outputs/apk/debug/DailyWird-iOS-Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Native Windows Desktop Application
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Desktop App Assets
        run: |
          if (-not (Test-Path desktop/index.html)) {
            throw "desktop/index.html does not exist!"
          }
          Write-Host "Verified desktop/index.html size: $((Get-Item desktop/index.html).Length) bytes"

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows Desktop Installer & Portable Executable
        working-directory: desktop
        run: npx electron-builder --win nsis portable

      - name: Collect Windows Executables
        run: |
          New-Item -ItemType Directory -Force -Path release-dist | Out-Null
          Get-ChildItem desktop/dist/*.exe | ForEach-Object {
            Write-Host "Found build output: $($_.FullName)"
            Copy-Item $_.FullName -Destination release-dist/ -Force
          }
          Get-ChildItem release-dist/

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DailyWird-Windows-Desktop-Apps
          path: release-dist/*.exe
          retention-days: 14

      - name: Publish Windows Apps to Release v1.1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          files: release-dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Universal DMG & ZIP
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS Applications (DMG & ZIP)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg zip

      - name: Collect macOS Artifacts
        run: |
          mkdir -p release-mac
          for f in $(find desktop/dist -maxdepth 2 -type f -name "*.dmg"); do
            cp "$f" release-mac/DailyWird-macOS-Universal.dmg
            cp "$f" release-mac/
          done
          for f in $(find desktop/dist -maxdepth 2 -type f -name "*.zip"); do
            cp "$f" release-mac/DailyWird-macOS-Universal.zip
            cp "$f" release-mac/
          done
          ls -la release-mac/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DailyWird-macOS-Desktop-Apps
          path: release-mac/*
          retention-days: 14

      - name: Publish macOS Apps to Release v1.1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          files: release-mac/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS iPhone IPA Package
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make iOS build script executable
        run: chmod +x ios/build_ipa.sh

      - name: Build iOS IPA Package
        run: ./ios/build_ipa.sh

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DailyWird-iOS-App-Package
          path: release-ios/*
          retention-days: 14

      - name: Publish iOS App to Release v1.1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          files: release-ios/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux AppImage & DEB Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build Linux Packages (AppImage & DEB)
        working-directory: desktop
        run: npx electron-builder --linux AppImage deb

      - name: Collect Linux Artifacts
        run: |
          mkdir -p release-linux
          for f in $(find desktop/dist -maxdepth 2 -type f -name "*.AppImage"); do
            cp "$f" release-linux/DailyWird-Linux.AppImage
            cp "$f" release-linux/
          done
          for f in $(find desktop/dist -maxdepth 2 -type f -name "*.deb"); do
            cp "$f" release-linux/DailyWird-Linux-amd64.deb
            cp "$f" release-linux/
          done
          ls -la release-linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DailyWird-Linux-Desktop-Packages
          path: release-linux/*
          retention-days: 14

      - name: Publish Linux Apps to Release v1.1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          files: release-linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}





