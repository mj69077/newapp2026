name: Build Android APK & Multi-Platform Packages

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        run: |
          touch .env
          touch .env.example
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper and Permissions
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Prepare Release APK Assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Noor-v1.3.0-Android.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Noor-Android.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DailyWird-iOS-Edition.apk

      - name: Publish New GitHub Release v1.3.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "Noor v1.3.0 | تطبيق نُور (Multi-Platform Ecosystem)"
          body: |
            # 🌟 تطبيق نُور | Noor - الإصدار الذهبي الشامل v1.3.0
            ### المنظومة القرآنية والإسلامية الشاملة لكافة الأجهزة والأنظمة
            **Windows • macOS • Linux • iOS (iPhone/iPad) • Android • Web PWA**

            ---

            ### ✨ أبرز مميزات وتحديثات الإصدار v1.3.0:
            - 🛰️ **تحديد الموقع الفضائي الدقيق (Universal Cross-Platform GPS):**
              - دعم كامل ومتكامل لنظام تحديد المواقع GPS عبر المتصفحات، هواتف iOS وAndroid، وأنظمة سطح المكتب Electron.
              - حساب فلكي دقيق لاتجاه القبلة باستخدام حساب المثلثات الكروي (Spherical Trigonometry) ومواقيت الصلاة حسب الإحداثيات الفعلية.
              - شريط معلوماتي حي (GPS Telemetry Banner) يعرض الإحداثيات والارتفاع والسرعة ومستوى الدقة بالأمتار.
            - 🗄️ **محرك قواعد البيانات المحلي المتقدم (NoorDB via IndexedDB):**
              - قاعدة بيانات محلية هيكلية حقيقية بديلة عن التخزين البسيط، تدعم 7 مستودعات بيانات (Object Stores): الختمات، سجلات التسبيح، خواطر التدبر، سجل الاستخارة، جدول المحاسبة، الأحاديث، والإعدادات.
              - معاملات غير متزامنة (Async Promise Transactions) مع إمكانية التصدير والاستيراد الفوري للبيانات بأمان تام.
            - 🎨 **المصحف الملون بأحكام التجويد (Interactive Tajweed Quran):**
              - تلوين قياسي معتمد لأحكام التجويد: أحكام المدود، النون الساكنة والغنة والإخفاء، القلقلة، الإدغام، والتفخيم والترقيق.
              - بطاقة تعريفية تفاعلية منبثقة عند النقر على أي حكم تشرح اسم الحكم ومقدار مده مع نغمة صوتية تعليمية.
            - 🎬 **صانع حالات وقصص الأذكار الرأسية (Islamic Reels & Story Motion Maker 9:16):**
              - استوديو تصميم حالات إنستغرام وواتساب وتيك توك بدقة عمودية 9:16 بنقرة واحدة مع لمعان ذهبي وجسيمات متحركة.
            - 🤲 **رفيق صلاة الاستخارة والصلوات الخاصة (Salat Al-Istikhara Companion):**
              - دليل تفاعلي خطوة بخطوة لكيفية صلاة الاستخارة، مع دعاء الاستخارة النبوي الصوتي وميزة "سجل استخاراتي" المحفوظة في NoorDB، وأدلة صلوات الجنازة والعيدين والكسوف والتراويح.
            - 🧭 **أطلس الحرمين الشريفين التفاعلي (Haramain 3D Isometric Atlas & Virtual Tour):**
              - خريطة تفاعلية أيزومترية 2.5D للمسجد الحرام والمسجد النبوي الشريف مع معالم تفصيلية استكشافية.
            - 📝 **سجل التدبر القرآني الشخصي (Personal Quran Reflection Journal):**
              - توثيق الخواطر التدبرية مباشرة عند أي آية قرآنية وربطها بالوسوم واستعراضها من سجل التدبر.
            - 🚗 **وضع القيادة والسفر الآمن (Hands-Free Driving & Travel Mode):**
              - واجهة قيادة ليلية خاصة بملء الشاشة مع أزرار لمسية عملاقة ودعاء السفر الصوتي التلقائي وعداد سرعة GPS.
            - ⚖️ **حاسبة زكاة الذهب والفضة اللحظية (Live Gold & Silver Zakat Engine):**
              - حساب شرعي دقيق لزكاة الذهب والفضة مع التحقق التلقائي من بلوغ النصاب الشرعي.
            - 📜 **مكتبة الأحاديث الصحاح وسنة اليوم المهجورة (Authentic Hadith Vault & Daily Sunan):**
              - محفظة أحاديث مصنفة من صحيح البخاري ومسلم وبطاقة يومية لإحياء سنن النبي ﷺ المهجورة وسلسلة التزام في NoorDB.
            - 🌿 **صيدلية الطب النبوي والغذاء المبارك (Prophetic Medicine & Nutrition Guide):**
              - دليل تفاعلي للأغذية والأعشاب النبوية المباركة مدعمة بالأحاديث والفوائد الطبية.

            ---
            **🔒 خصوصية مطلقة: 100% بدون إنترنت (Offline) • خالي تماماً من الإعلانات والتتبع • مجاني لوجه الله تعالى**
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/Noor-v1.3.0-Android.apk
            app/build/outputs/apk/debug/Noor-Android.apk
            app/build/outputs/apk/debug/DailyWird-iOS-Edition.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Native Windows Desktop Application
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Desktop App Assets
        run: |
          if (-not (Test-Path desktop/index.html)) {
            throw "desktop/index.html does not exist!"
          }
          Write-Host "Verified desktop/index.html size: $((Get-Item desktop/index.html).Length) bytes"

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows Desktop Installer & Portable Executable
        working-directory: desktop
        run: npx electron-builder --win nsis portable

      - name: Collect Windows Executables
        run: |
          New-Item -ItemType Directory -Force -Path release-dist | Out-Null
          Get-ChildItem desktop/dist/*.exe | ForEach-Object {
            Write-Host "Found build output: $($_.FullName)"
            Copy-Item $_.FullName -Destination release-dist/ -Force
            if ($_.Name -like "*Setup*") {
              Copy-Item $_.FullName -Destination "release-dist/Noor-v1.3.0-Windows-Setup.exe" -Force
              Copy-Item $_.FullName -Destination "release-dist/Noor-Windows-Setup.exe" -Force
              Copy-Item $_.FullName -Destination "release-dist/Noor.Setup.1.3.0.exe" -Force
              Copy-Item $_.FullName -Destination "release-dist/DailyWird.Setup.1.1.0.exe" -Force
            } else {
              Copy-Item $_.FullName -Destination "release-dist/Noor-v1.3.0-Windows-Portable.exe" -Force
              Copy-Item $_.FullName -Destination "release-dist/Noor-Windows-Portable.exe" -Force
              Copy-Item $_.FullName -Destination "release-dist/Noor.1.3.0.exe" -Force
              Copy-Item $_.FullName -Destination "release-dist/DailyWird.1.1.0.exe" -Force
            }
          }
          Get-ChildItem release-dist/

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Windows-Desktop-Apps
          path: release-dist/*.exe
          retention-days: 14

      - name: Publish Windows Apps to Release v1.3.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          files: release-dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Universal DMG & ZIP
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS Applications (DMG & ZIP)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg zip

      - name: Collect macOS Artifacts
        run: |
          mkdir -p release-mac
          for f in $(find desktop/dist -maxdepth 2 -type f -name "*.dmg"); do
            cp "$f" release-mac/Noor-v1.3.0-macOS-Universal.dmg
            cp "$f" release-mac/Noor-macOS-Universal.dmg
            cp "$f" release-mac/DailyWird-macOS-Universal.dmg
            cp "$f" release-mac/
          done
          for f in $(find desktop/dist -maxdepth 2 -type f -name "*.zip"); do
            cp "$f" release-mac/Noor-v1.3.0-macOS-Universal.zip
            cp "$f" release-mac/Noor-macOS-Universal.zip
            cp "$f" release-mac/DailyWird-macOS-Universal.zip
            cp "$f" release-mac/
          done
          ls -la release-mac/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Noor-macOS-Desktop-Apps
          path: release-mac/*
          retention-days: 14

      - name: Publish macOS Apps to Release v1.3.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          files: release-mac/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS iPhone IPA Package
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make iOS build script executable
        run: chmod +x ios/build_ipa.sh

      - name: Build iOS IPA Package
        run: ./ios/build_ipa.sh

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Noor-iOS-App-Package
          path: release-ios/*
          retention-days: 14

      - name: Publish iOS App to Release v1.3.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          files: release-ios/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux AppImage & DEB Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build Linux Packages (AppImage & DEB)
        working-directory: desktop
        run: npx electron-builder --linux AppImage deb

      - name: Collect Linux Artifacts
        run: |
          mkdir -p release-linux
          for f in $(find desktop/dist -maxdepth 2 -type f -name "*.AppImage"); do
            cp "$f" release-linux/Noor-v1.3.0-Linux.AppImage
            cp "$f" release-linux/Noor-Linux.AppImage
            cp "$f" release-linux/DailyWird-Linux.AppImage
            cp "$f" release-linux/
          done
          for f in $(find desktop/dist -maxdepth 2 -type f -name "*.deb"); do
            cp "$f" release-linux/Noor-v1.3.0-Linux-amd64.deb
            cp "$f" release-linux/Noor-Linux-amd64.deb
            cp "$f" release-linux/DailyWird-Linux-amd64.deb
            cp "$f" release-linux/
          done
          ls -la release-linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Linux-Desktop-Packages
          path: release-linux/*
          retention-days: 14

      - name: Publish Linux Apps to Release v1.3.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          files: release-linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
